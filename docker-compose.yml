services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: roshambo-server
    env_file:
      - ./server/.env
    ports:
      - "3001:3001"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        - VITE_SOCKET_URL=http://localhost:3001
    container_name: roshambo-frontend
    ports:
      - "8080:80"
    depends_on:
      - server
