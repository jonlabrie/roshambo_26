version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - pwd
      - ls -la
      - cd server && npm install && npm run build
run:
  command: node server/dist/index.js
  network:
    port: 3001
  env:
    - name: PORT
      value: "3001"
    - name: TEST_MODE
      value: "true"
  secrets:
    - name: MONGODB_URI
      value-from: "arn:aws:ssm:us-east-1:198886313292:parameter/roshambo/MONGODB_URI"
    - name: JWT_SECRET
      value-from: "arn:aws:ssm:us-east-1:198886313292:parameter/roshambo/JWT_SECRET"
    - name: API_KEY
      value-from: "arn:aws:ssm:us-east-1:198886313292:parameter/roshambo/API_KEY"
