name: server-ci
on:
  push:
    paths: ["server/**", "shared-fixtures/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", "shared-fixtures/**", ".github/workflows/server-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
      - run: npm ci
      - run: npm run build
      - run: npm test
