name: roblox-ci
on:
  push:
    paths: ["roblox/**", "shared-fixtures/**", ".github/workflows/roblox-ci.yml"]
  pull_request:
    paths: ["roblox/**", "shared-fixtures/**", ".github/workflows/roblox-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roblox
    steps:
      - uses: actions/checkout@v4
      - name: No committed place files
        working-directory: ${{ github.workspace }}
        run: |
          matches=$(git ls-files '*.rbxl' '*.rbxlx')
          if [ -n "$matches" ]; then
            echo "::error::Committed Roblox place file(s) found. The place is place-only; never commit a built .rbxl(x):"
            echo "$matches"
            exit 1
          fi
          echo "OK — no tracked place files."
      - name: art/ holds only what no script can reproduce
        working-directory: ${{ github.workspace }}
        run: |
          # art/ is for hand-authored source that cannot be regenerated (art/README.md).
          # Derived output belongs in the untracked scratch dir; if it lands here it will be
          # silently trusted as source the next time someone rebuilds.
          derived=$(git ls-files 'art/**' \
            | grep -Ei '\.(fbx|obj|rbxm|rbxmx|dae|gltf|glb)$|_baked\.|karasu_retarget\.blend$' || true)
          if [ -n "$derived" ]; then
            echo "::error::Derived file(s) committed under art/. art/ is irreproducible source only:"
            echo "$derived"
            exit 1
          fi
          # Every name the pipeline refuses to overwrite must actually be stored here, or the
          # guard is protecting a path nothing keeps.
          missing=""
          for f in $(python3 - <<'EOF'
import re
src = open("roblox/tools/blender/karasu_retarget.py").read()
names = re.findall(r'^(?:COLORMAP_AUTHORITY|AUTHORED_BLEND)\s*=\s*"([^"]+)"', src, re.M)
assert re.search(r'^ART_SOURCES\s*=\s*\{COLORMAP_AUTHORITY, AUTHORED_BLEND\}', src, re.M), \
    "ART_SOURCES is not the pair this check knows how to resolve"
print("\n".join(sorted(set(names))))
EOF
          ); do
            [ -n "$(git ls-files "art/**/$f")" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::ART_SOURCES not stored under art/:$missing"
            exit 1
          fi
          echo "OK — art/ is source-only and every guarded file is stored."
      - name: Install Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
      - name: Install pinned tools
        run: rokit install --no-trust-check
      - name: Lune tests
        run: lune run tests/run
      - name: Generated models are current
        run: |
          lune run tools/genmodels
          git add -N assets && git diff --exit-code assets
      - name: Format check
        run: stylua --check src tests tools
      - name: Lint
        run: selene src tools
      - name: Rojo build
        run: rojo build -o roshambo-skeleton.rbxl
      - uses: actions/upload-artifact@v4
        with:
          name: roshambo-skeleton
          path: roblox/roshambo-skeleton.rbxl
